<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="logo.png">
<title>Admin - Keuangan Gereja Kristen Jawa Logandeng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root { --hijau:#7a4a21; --segar:#d98a3d; --mint:#fbeedd; --garis:#ecd5bb; --emas:#f2b705; --teks:#3b2415; }
  body { background:#fff9f2; color:var(--teks); font-family:'Nunito',system-ui,sans-serif; font-size:1.05rem; }
  h1,h2,.h5,.btn-hijau { font-family:'Baloo 2','Nunito',sans-serif; }
  header { background:linear-gradient(135deg,#7a4a21 0%,#b9773a 100%); color:#fff; padding:1.5rem 1rem 1.8rem; border-bottom:6px solid var(--emas); border-radius:0 0 28px 28px; box-shadow:0 8px 20px rgba(122,74,33,.25);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56'><path d='M28 18v22M20 26h16' fill='none' stroke='white' stroke-opacity='.15' stroke-width='2.4' stroke-linecap='round'/></svg>"), linear-gradient(135deg,#7a4a21 0%,#b9773a 100%); }
  header h1 { font-size:1.5rem; margin:0; font-weight:700; line-height:1.15; }
  header p { margin:.25rem 0 0; color:#fff3c2; font-weight:600; }
  .kepala { display:flex; align-items:center; gap:1rem; max-width:900px; margin:0 auto; text-align:left; }
  .kepala img { width:70px; height:70px; object-fit:contain; background:#fff; border-radius:50%; padding:5px; flex-shrink:0; border:3px solid var(--emas); box-shadow:0 4px 10px rgba(0,0,0,.2); }
  @media (max-width:480px) { .kepala img { width:56px; height:56px; } header h1 { font-size:1.15rem; } }
  main h2 { font-weight:700; color:var(--hijau); padding-left:.7rem; border-left:6px solid var(--emas); font-size:1.3rem; }
  .salam { background:#fff; border:2px dashed var(--segar); border-radius:16px; padding:.8rem 1rem; color:var(--hijau); font-weight:600; }
  .kotak { border-radius:18px; padding:1rem; height:100%; border:2px solid var(--garis); background:#fff; box-shadow:0 4px 12px rgba(122,74,33,.08); }
  .kotak small { display:block; font-weight:700; color:#8a6a4f; }
  .kotak strong { font-family:'Baloo 2',sans-serif; font-size:1.35rem; line-height:1.3; }
  .row > div:nth-child(1) .kotak { background:#fdf0e0; }
  .row > div:nth-child(2) .kotak { background:#dcf5e4; border-color:#a9dfbd; }
  .row > div:nth-child(3) .kotak { background:#fff0ee; border-color:#f5c6c0; }
  .kotak.utama { background:linear-gradient(135deg,#7a4a21,#b9773a); border-color:var(--emas); border-width:3px; color:#fff; }
  .kotak.utama small { color:#fff3c2; }
  .masuk { color:#16854a; font-weight:700; } .keluar { color:#d6453d; font-weight:700; }
  .table-responsive { border-radius:18px; border:2px solid var(--garis) !important; background:#fff !important; box-shadow:0 4px 12px rgba(122,74,33,.08); }
  th, td { vertical-align:middle; }
  th { background:var(--hijau) !important; color:#fff !important; white-space:nowrap; font-weight:700; }
  .buku { min-width:680px; }
  .buku th.th-masuk { background:#2e9e5b !important; } .buku th.th-keluar { background:#d6453d !important; }
  .buku td.c-masuk { color:#16854a; font-weight:700; background:#effaf2; }
  .buku td.c-keluar { color:#d6453d; font-weight:700; background:#fff4f2; }
  .buku td.c-saldo { font-weight:800; color:var(--hijau); }
  .kat { display:inline-block; font-size:.8rem; font-weight:700; color:var(--hijau); background:var(--mint); border-radius:20px; padding:0 .55rem; margin-top:.15rem; }
  .form-label { font-weight:700; color:var(--hijau); }
  .form-control, .form-select { border:2px solid var(--garis); border-radius:12px; padding:.65rem .8rem; font-size:1.05rem; }
  .form-control:focus, .form-select:focus { border-color:var(--segar); box-shadow:0 0 0 .25rem rgba(217,138,61,.2); }
  .btn-hijau { background:linear-gradient(135deg,#b9773a,#7a4a21); color:#fff; font-weight:700; font-size:1.1rem; padding:.55rem 1.6rem; border-radius:50px; border:0; box-shadow:0 4px 10px rgba(122,74,33,.3); }
  .btn-hijau:hover { background:#7a4a21; color:#fff; }
  .btn-sm { border-radius:50px; font-weight:700; }
  #formKotak { border-radius:20px !important; border:2px solid var(--garis) !important; box-shadow:0 6px 16px rgba(122,74,33,.1); }
  #formKotak.edit { border:3px solid var(--emas) !important; background:#fffbe6 !important; }
  .program { margin-left:auto; text-align:right; flex-shrink:0; }
  .program small { display:block; font-size:.75rem; font-weight:600; color:#ffe9cf; }
  .program b { display:block; font-family:'Baloo 2',sans-serif; font-size:1.05rem; line-height:1.2; }
  .program span { display:block; font-size:.72rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:#f2b705; }
  @media (max-width:600px) { .kepala { flex-wrap:wrap; } .program { order:-1; width:100%; margin-bottom:.2rem; } .program b { font-size:.95rem; } }
  .periode { display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; background:#fff; border:2px solid var(--garis); border-radius:16px; padding:.7rem 1rem; margin-bottom:1rem; }
  .periode label { font-weight:700; color:var(--hijau); margin:0; }
  .periode .form-select, .periode .form-control { width:auto; padding:.4rem .6rem; font-size:1rem; }
  .tabs { display:flex; gap:.5rem; margin-bottom:1rem; }
  .tabs button { flex:1; border:2px solid var(--garis); background:#fff; border-radius:50px; padding:.5rem .6rem; font-weight:700; color:var(--hijau); font-family:'Baloo 2',sans-serif; font-size:1.05rem; }
  .tabs button.aktif { background:linear-gradient(135deg,var(--hijau),#b9773a); color:#fff; border-color:var(--emas); box-shadow:0 3px 8px rgba(122,74,33,.3); }
  .total-bar, .blok-h { display:flex; justify-content:space-between; align-items:center; gap:.5rem; color:#fff; font-weight:700; font-family:'Baloo 2',sans-serif; }
  .total-bar { padding:.7rem 1rem; border-radius:16px; margin-bottom:1rem; font-size:1.15rem; }
  .total-bar.Masuk, .blok-h.Masuk { background:#2e9e5b; } .total-bar.Keluar, .blok-h.Keluar { background:#d6453d; }
  .blok { margin-bottom:1.1rem; }
  .blok-h { padding:.5rem .9rem; border-radius:16px 16px 0 0; }
  .blok .table-responsive { border-top-left-radius:0; border-top-right-radius:0; border-top:0 !important; }
  .row .kotak.inv { background:#fff8e1 !important; border-color:#f2d680 !important; }
  .kotak em { display:block; font-style:normal; font-size:.85rem; color:#8a6a4f; }
  .catatan { color:#8a6a4f; font-size:.95rem; margin-bottom:1.5rem; }
</style>
</head>
<body>
<header>
  <div class="kepala">
    <img src="logo.png" alt="Logo GKJ Logandeng" onerror="this.style.display='none'">
    <div>
      <h1>Admin Keuangan Gereja Kristen Jawa Logandeng</h1>
      <p>Halaman khusus bendahara</p>
    </div>
    <div class="program"><b>PLK Logandeng 2026</b><span>UNY Mengabdi 2026/1</span></div>
  </div>
</header>

<main class="container py-4" style="max-width:900px">
  <div id="formKotak" class="bg-white border rounded p-3 mb-4">
    <h2 class="h5 mb-3" id="judulForm">Tambah transaksi</h2>
    <input type="hidden" id="id">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="tanggal">Tanggal</label>
        <input type="date" id="tanggal" class="form-control">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="tipe">Jenis transaksi</label>
        <select id="tipe" class="form-select">
          <option value="Masuk">Pemasukan</option>
          <option value="Keluar">Pengeluaran</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="kategori">Kategori</label>
        <select id="kategori" class="form-select"></select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="nominal">Nominal (Rp)</label>
        <input type="number" id="nominal" class="form-control" min="1" inputmode="numeric" placeholder="Contoh: 150000">
      </div>
      <div class="col-12">
        <label class="form-label" for="keterangan">Keterangan</label>
        <input type="text" id="keterangan" class="form-control" placeholder="Contoh: Persembahan ibadah Minggu">
      </div>
    </div>
    <div id="notif" class="alert d-none mt-3 mb-0"></div>
    <div class="mt-3 d-flex gap-2">
      <button id="btnSimpan" class="btn btn-hijau" onclick="simpan()">Simpan</button>
      <button id="btnBatal" class="btn btn-outline-secondary d-none" onclick="reset()">Batal edit</button>
    </div>
  </div>

  <h2 class="h5 mb-3">Riwayat transaksi</h2>
  <div class="periode">
    <label for="mode">Periode:</label>
    <select id="mode" class="form-select"><option value="bulan">Per bulan</option><option value="rentang">Rentang tanggal</option><option value="semua">Semua waktu</option></select>
    <input type="month" id="inBulan" class="form-control">
    <span id="boxRentang" class="d-none"><input type="date" id="dari" class="form-control d-inline-block"> s/d <input type="date" id="sampai" class="form-control d-inline-block"></span>
  </div>
  <div class="tabs" id="tabs">
    <button data-v="campuran" class="aktif">Campuran</button>
    <button data-v="masuk">Pemasukan</button>
    <button data-v="keluar">Pengeluaran</button>
  </div>
  <div id="isiTabel"></div>
</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxIb7892M3_tzWNxdnX4ye1JZNdvG1KuuP2d17rpeiL9WbCmUPYpmHcNaraKqMInClR/exec';
const ADMIN = true;
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const KATEGORI = {
  Masuk: ['Persembahan Ibadah Pendidikan', 'Persembahan Ibadah Pembangunan', 'Persembahan Ibadah Diakonia',
          'Persembahan Ibadah Bulanan', 'Persembahan Hari Raya', 'Persembahan Khusus', 'Mantenan', 'Unduh-Unduh',
          'Donasi Pihak Luar', 'Penarikan Investasi Jangka Panjang', 'Penarikan Investasi Jangka Pendek', 'Pemasukan Lain-Lain'],
  Keluar: ['Kebutuhan Gereja', 'Pemeliharaan Gereja', 'Bantuan Kemanusiaan',
           'Investasi Jangka Panjang', 'Investasi Jangka Pendek', 'Pengeluaran Lain-Lain']
};
const rp = n => 'Rp ' + Number(n).toLocaleString('id-ID');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
let dataSemua = [], tampilan = 'campuran', dimuat = false;

function tglIndo(t) { const [y, m, d] = t.split('-'); return d + ' ' + BULAN[m - 1].slice(0, 3) + ' ' + y; }

// Tanggal WIB (Asia/Jakarta)
function wib() {
  const p = {};
  new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit', day: '2-digit' })
    .formatToParts(new Date()).forEach(x => p[x.type] = x.value);
  return { y: p.year, m: p.month, d: p.day };
}

const nilai = t => t.tipe === 'Masuk' ? t.nominal : -t.nominal;
const aksi = t => ADMIN ? `<td class="text-nowrap"><button class="btn btn-sm btn-outline-success" onclick="edit('${esc(t.id)}')">Edit</button>
        <button class="btn btn-sm btn-outline-danger ms-1" onclick="hapus('${esc(t.id)}')">Hapus</button></td>` : '';

function rentang() {
  const mode = $('mode').value;
  if (mode === 'semua') return { dari: '0000-01-01', sampai: '9999-12-31', label: 'Semua waktu' };
  if (mode === 'rentang') {
    const d = $('dari').value, s = $('sampai').value;
    return { dari: d || '0000-01-01', sampai: s || '9999-12-31',
             label: (d ? tglIndo(d) : 'awal') + ' s/d ' + (s ? tglIndo(s) : 'sekarang') };
  }
  const w = wib(), v = $('inBulan').value || (w.y + '-' + w.m);
  const [y, m] = v.split('-');
  const akhir = String(new Date(y, m, 0).getDate()).padStart(2, '0');
  return { dari: v + '-01', sampai: v + '-' + akhir, label: BULAN[m - 1] + ' ' + y };
}

function tabelCampuran(rows) {
  const isi = rows.length ? rows.map(t => `
    <tr>
      <td class="text-nowrap">${tglIndo(t.tanggal)}</td>
      <td>${esc(t.keterangan || '-')}<span class="kat">${esc(t.kategori)}</span></td>
      <td class="text-end text-nowrap c-masuk">${t.tipe === 'Masuk' ? rp(t.nominal) : '-'}</td>
      <td class="text-end text-nowrap c-keluar">${t.tipe === 'Keluar' ? rp(t.nominal) : '-'}</td>
      <td class="text-end text-nowrap c-saldo">${rp(t.saldo)}</td>${aksi(t)}
    </tr>`).join('') : `<tr><td colspan="${ADMIN ? 6 : 5}" class="text-center text-muted">Belum ada transaksi pada periode ini.</td></tr>`;
  return `<div class="table-responsive"><table class="table table-hover mb-0 buku"><thead><tr><th>Tanggal</th><th>Keterangan</th><th class="text-end th-masuk">Pemasukan</th><th class="text-end th-keluar">Pengeluaran</th><th class="text-end">Saldo</th>${ADMIN ? '<th></th>' : ''}</tr></thead><tbody>${isi}</tbody></table></div>`;
}

function perJenis(rows, tipe) {
  const semua = rows.filter(t => t.tipe === tipe).reverse();
  const jumlah = l => l.reduce((a, t) => a + t.nominal, 0);
  const daftar = KATEGORI[tipe].slice();
  if (semua.some(t => !daftar.includes(t.kategori))) daftar.push('__lama');
  let h = `<div class="total-bar ${tipe}"><span>Total ${tipe === 'Masuk' ? 'Pemasukan' : 'Pengeluaran'}</span><b>${rp(jumlah(semua))}</b></div>`;
  daftar.forEach(k => {
    const list = semua.filter(t => k === '__lama' ? !KATEGORI[tipe].includes(t.kategori) : t.kategori === k);
    const isi = list.length ? list.map(t => `
      <tr>
        <td class="text-nowrap">${tglIndo(t.tanggal)}</td>
        <td>${esc(t.keterangan || '-')}</td>
        <td class="text-end text-nowrap ${tipe === 'Masuk' ? 'masuk' : 'keluar'}">${rp(t.nominal)}</td>${aksi(t)}
      </tr>`).join('') : `<tr><td colspan="${ADMIN ? 4 : 3}" class="text-center text-muted">Belum ada transaksi.</td></tr>`;
    h += `<div class="blok"><div class="blok-h ${tipe}"><span>${k === '__lama' ? 'Kategori lain (data lama)' : esc(k)}</span><b>${rp(jumlah(list))}</b></div>
      <div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Tanggal</th><th>Keterangan</th><th class="text-end">Nominal</th>${ADMIN ? '<th></th>' : ''}</tr></thead><tbody>${isi}</tbody></table></div></div>`;
  });
  return h;
}

function render() {
  if (!dimuat) return;
  const r = rentang();
  const urut = dataSemua.map((t, i) => ({ ...t, i })).sort((a, b) => a.tanggal.localeCompare(b.tanggal) || a.i - b.i);
  let s = 0; urut.forEach(t => { s += nilai(t); t.saldo = s; });
  const dalam = urut.filter(t => t.tanggal >= r.dari && t.tanggal <= r.sampai);

  if ($('awal')) { // ringkasan + investasi (hanya halaman jemaat)
    let awal = 0, masuk = 0, keluar = 0;
    urut.forEach(t => { if (t.tanggal < r.dari) awal += nilai(t); });
    dalam.forEach(t => { if (t.tipe === 'Masuk') masuk += t.nominal; else keluar += t.nominal; });
    $('bulan').textContent = r.label;
    $('awal').textContent = rp(awal); $('masuk').textContent = rp(masuk);
    $('keluar').textContent = rp(keluar); $('akhir').textContent = rp(awal + masuk - keluar);
    const sd = urut.filter(t => t.tanggal <= r.sampai);
    const inv = k => sd.reduce((a, t) => a
      + (t.tipe === 'Keluar' && t.kategori === 'Investasi ' + k ? t.nominal : 0)
      - (t.tipe === 'Masuk' && t.kategori === 'Penarikan Investasi ' + k ? t.nominal : 0), 0);
    const p = inv('Jangka Panjang'), q = inv('Jangka Pendek');
    $('invPanjang').textContent = rp(p); $('invPendek').textContent = rp(q);
    $('invTotal').textContent = 'Total dana investasi: ' + rp(p + q);
  }
  $('isiTabel').innerHTML = tampilan === 'campuran'
    ? tabelCampuran(dalam.slice().reverse())
    : perJenis(dalam, tampilan === 'masuk' ? 'Masuk' : 'Keluar');
}

function initPeriode() {
  const w = wib(); $('inBulan').value = w.y + '-' + w.m;
  const ganti = () => {
    const m = $('mode').value;
    $('inBulan').classList.toggle('d-none', m !== 'bulan');
    $('boxRentang').classList.toggle('d-none', m !== 'rentang');
    render();
  };
  ['mode', 'inBulan', 'dari', 'sampai'].forEach(id => $(id).addEventListener('change', ganti));
  document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => {
    tampilan = b.dataset.v;
    document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('aktif', x === b));
    render();
  }));
}

function isiKategori(pilih) {
  $('kategori').innerHTML = KATEGORI[$('tipe').value].map(k => `<option>${k}</option>`).join('');
  if (pilih) $('kategori').value = pilih;
}
$('tipe').addEventListener('change', () => isiKategori());

function hariIni() { const w = wib(); return w.y + '-' + w.m + '-' + w.d; }

function notif(teks, jenis) {
  const n = $('notif');
  n.className = 'alert mt-3 mb-0 alert-' + jenis;
  n.textContent = teks;
}

function reset() {
  $('id').value = ''; $('nominal').value = ''; $('keterangan').value = '';
  $('tanggal').value = hariIni(); $('tipe').value = 'Masuk'; isiKategori();
  $('judulForm').textContent = 'Tambah transaksi';
  $('btnSimpan').textContent = 'Simpan';
  $('btnBatal').classList.add('d-none');
  $('formKotak').classList.remove('edit');
}

async function muat() {
  try {
    const res = await fetch(API_URL);
    const json = await res.json();
    if (json.status !== 'ok') throw new Error(json.message);
    dataSemua = json.data; dimuat = true; render();
  } catch (e) {
    $('isiTabel').innerHTML = '<div class="alert alert-danger">Data gagal dimuat. Periksa koneksi lalu muat ulang.</div>';
  }
}

function edit(id) {
  const t = dataSemua.find(x => x.id === id);
  if (!t) return;
  $('id').value = t.id;
  $('tanggal').value = t.tanggal;
  $('tipe').value = t.tipe; isiKategori(t.kategori);
  $('nominal').value = t.nominal;
  $('keterangan').value = t.keterangan;
  $('judulForm').textContent = 'Ubah transaksi';
  $('btnSimpan').textContent = 'Update';
  $('btnBatal').classList.remove('d-none');
  $('formKotak').classList.add('edit');
  $('notif').classList.add('d-none');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function hapus(id) {
  const t = dataSemua.find(x => x.id === id);
  if (!t) return;
  if (!confirm('Hapus transaksi ini?\n\n' + t.tanggal + ' - ' + (t.keterangan || t.kategori) + ' - ' + rp(t.nominal) + '\n\nData yang dihapus tidak bisa dikembalikan.')) return;
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'hapus', id: id })
    });
    const json = await res.json();
    if (json.status !== 'ok') throw new Error(json.message);
    if ($('id').value === id) reset();
    notif('Data berhasil dihapus.', 'success');
    await muat();
  } catch (e) {
    notif('Gagal menghapus: ' + e.message, 'danger');
  }
}

async function simpan() {
  const payload = {
    id: $('id').value,
    tanggal: $('tanggal').value,
    tipe: $('tipe').value,
    kategori: $('kategori').value,
    keterangan: $('keterangan').value.trim(),
    nominal: Number($('nominal').value)
  };
  if (!payload.tanggal || !(payload.nominal > 0)) {
    return notif('Isi tanggal dan nominal terlebih dahulu.', 'warning');
  }
  const btn = $('btnSimpan'), label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // menghindari preflight CORS
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (json.status !== 'ok') throw new Error(json.message);
    const mode = json.mode;
    reset();
    notif(mode === 'update' ? 'Data berhasil diubah.' : 'Data berhasil disimpan.', 'success');
    await muat();
  } catch (e) {
    notif('Gagal menyimpan: ' + e.message, 'danger');
    btn.textContent = label;
  } finally {
    btn.disabled = false;
  }
}
